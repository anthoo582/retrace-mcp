# Fragmento para ~/.codex/config.toml (fusionar, NO sobrescribir el archivo).
# Los nombres de servidor MCP en Codex son globales al host: usa un nombre único.

[mcp_servers.retrace]
command = "node"
args = ["C:/ruta/a/retrace-mcp/dist/index.js"]

[mcp_servers.retrace.env]
RETRACE_WORKSPACE = "C:/ruta/a/tu/proyecto"
RETRACE_PYTHON = "python"
